<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fret Driller</title>
  <meta name="description" content="Drill the guitar fretboard: find notes, name notes, play note sequences and scale patterns.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23f0b44c'/%3E%3Cg stroke='%231a1408' stroke-width='2'%3E%3Cpath d='M6 9h20M6 16h20M6 23h20'/%3E%3Cpath d='M12 6v20M20 6v20' stroke-width='1.4'/%3E%3C/g%3E%3Ccircle cx='16' cy='16' r='3.6' fill='%231a1408'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="brand"><span class="logo" aria-hidden="true"></span>Fret Driller</div>
    <nav class="tabs" id="tabs">
      <button data-tab="find">Find the note</button>
      <button data-tab="name">Name the note</button>
      <button data-tab="sequence">Sequences</button>
      <button data-tab="scales">Scale patterns</button>
      <button data-tab="explore">Explore</button>
      <span class="spacer"></span>
      <button data-tab="stats">Stats</button>
      <button data-tab="settings">Settings</button>
    </nav>
  </header>

  <main>
    <section id="drill-view" class="view">
      <div class="prompt-row">
        <div class="prompt" aria-live="polite">
          <div id="prompt-main" class="prompt-main"></div>
          <div id="prompt-sub" class="prompt-sub"></div>
        </div>
        <div class="hud-wrap">
          <div id="hud" class="hud"></div>
          <button id="hud-reset" class="link">reset session</button>
        </div>
      </div>
      <div id="strip" class="strip" hidden></div>
      <div class="board-wrap"><svg id="board" class="board" aria-label="Guitar fretboard"></svg></div>
      <div id="pad" class="pad" hidden></div>
      <div class="panel">
        <div id="options" class="options"></div>
        <div id="hint" class="hint"></div>
      </div>
    </section>
    <section id="explore-view" class="view" hidden></section>
    <section id="stats-view" class="view" hidden></section>
    <section id="settings-view" class="view" hidden></section>
  </main>

  <script src="js/theory.js"></script>
  <script src="js/store.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/fretboard.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/drills.js"></script>
  <script src="js/views.js"></script>
  <script src="js/explore.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
