<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fret Driller</title>
  <meta name="description" content="Drill the guitar fretboard: find notes, name notes, play note sequences and scale patterns.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2303060c'/%3E%3Crect x='14.5' y='4' width='3' height='17' rx='1.5' fill='%233fb8ff'/%3E%3Crect x='13' y='21' width='6' height='7' rx='1' fill='%23a9b4c2'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Exo+2:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css?v=10">
  <script>
    try { document.documentElement.dataset.side = (JSON.parse(localStorage.getItem('fretdriller.v1')) || {}).settings.side || 'jedi'; }
    catch (e) { document.documentElement.dataset.side = 'jedi'; }
  </script>
</head>
<body>
  <canvas id="stars" aria-hidden="true"></canvas>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <header class="top">
    <a class="brand" href="#explore" aria-label="Fret Driller home"><span class="logo" aria-hidden="true"><i></i></span><span>Fret Driller</span></a>
    <nav class="tabs" id="tabs">
      <div class="nav-group">
        <span class="nav-label">Learn</span>
        <button data-tab="explore">Fretboard map</button>
      </div>
      <div class="nav-group">
        <span class="nav-label">Drill</span>
        <button data-tab="find">Find the note</button>
        <button data-tab="name">Name the note</button>
        <button data-tab="sequence">Sequences</button>
        <button data-tab="scales">Scale patterns</button>
      </div>
      <div class="nav-group">
        <span class="nav-label">Play</span>
        <button data-tab="jam">Jam</button>
      </div>
    </nav>
    <div class="top-right">
      <div class="rank" id="rank"></div>
      <div class="seg inst" id="inst" role="group" aria-label="Instrument">
        <button data-inst="guitar">Guitar</button>
        <button data-inst="bass">Bass</button>
      </div>
      <div class="seg side" id="side" role="group" aria-label="Side of the Force">
        <button data-side="jedi">Jedi</button>
        <button data-side="sith">Sith</button>
      </div>
      <button class="icon-btn" data-tab="stats" title="Stats" aria-label="Stats"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></button>
      <button class="icon-btn" data-tab="settings" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg></button>
    </div>
  </header>
  <div id="qotd" class="qotd" hidden></div>

  <main>
    <section id="drill-view" class="view">
      <div class="prompt-row">
        <div class="prompt" aria-live="polite">
          <div id="prompt-main" class="prompt-main"></div>
          <div id="prompt-sub" class="prompt-sub"></div>
        </div>
        <div class="hud-wrap">
          <div id="hud" class="hud"></div>
          <button id="hud-reset" class="link">reset session</button>
        </div>
      </div>
      <div id="strip" class="strip" hidden></div>
      <div class="board-wrap"><svg id="board" class="board" aria-label="Fretboard"></svg></div>
      <div id="pad" class="pad" hidden></div>
      <div class="panel">
        <div id="options" class="options"></div>
        <div id="hint" class="hint"></div>
      </div>
    </section>
    <section id="explore-view" class="view" hidden></section>
    <section id="jam-view" class="view" hidden></section>
    <section id="stats-view" class="view" hidden></section>
    <section id="settings-view" class="view" hidden></section>
  </main>

  <script src="js/theory.js?v=10"></script>
  <script src="js/store.js?v=10"></script>
  <script src="js/audio.js?v=10"></script>
  <script src="js/fretboard.js?v=10"></script>
  <script src="js/ui.js?v=10"></script>
  <script src="js/drills.js?v=10"></script>
  <script src="js/views.js?v=10"></script>
  <script src="js/chords.js?v=10"></script>
  <script src="js/explore.js?v=10"></script>
  <script src="js/backing.js?v=10"></script>
  <script src="js/jam.js?v=10"></script>
  <script src="js/theme.js?v=10"></script>
  <script src="js/app.js?v=10"></script>
  <script src="js/quotes.js?v=10"></script>
</body>
</html>
